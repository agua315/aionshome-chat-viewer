<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-label="第一次启动，只需这四步"><rect width="100%" height="100%" rx="24" fill="#f4f6ef"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#25332e"><text x="36" y="56" font-size="28" font-weight="600">第一次启动，只需这四步</text><text x="36" y="92" font-size="16" fill="#748179">Windows 电脑 · 本地读取 AionsHome 已保存的数据</text><rect x="36" y="133" width="248.5" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="66" cy="164" r="15" fill="#246b56"/><text x="66" y="170" text-anchor="middle" font-size="16" fill="white">1</text><text x="58" y="211" font-size="20" font-weight="600">准备环境</text><text x="58" y="247" font-size="15" fill="#748179">Node.js 24 或更新版本</text><text x="58" y="274" font-size="15" fill="#748179">安装 Edge / Chrome</text><path d="M 288.5 225 h 10 m -4 -5 l 5 5 -5 5" fill="none" stroke="#8da08e" stroke-width="2"/><rect x="302.5" y="133" width="248.5" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="332.5" cy="164" r="15" fill="#246b56"/><text x="332.5" y="170" text-anchor="middle" font-size="16" fill="white">2</text><text x="324.5" y="211" font-size="20" font-weight="600">下载源码</text><text x="324.5" y="247" font-size="15" fill="#748179">Code → Download ZIP</text><text x="324.5" y="274" font-size="15" fill="#748179">解压到自己的文件夹</text><path d="M 555 225 h 10 m -4 -5 l 5 5 -5 5" fill="none" stroke="#8da08e" stroke-width="2"/><rect x="569" y="133" width="248.5" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="599" cy="164" r="15" fill="#246b56"/><text x="599" y="170" text-anchor="middle" font-size="16" fill="white">3</text><text x="591" y="211" font-size="20" font-weight="600">填写数据位置</text><text x="591" y="247" font-size="15" fill="#748179">复制示例为 config.json</text><text x="591" y="274" font-size="15" fill="#748179">填写 aion-chat/data 目录</text><path d="M 821.5 225 h 10 m -4 -5 l 5 5 -5 5" fill="none" stroke="#8da08e" stroke-width="2"/><rect x="835.5" y="133" width="248.5" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="865.5" cy="164" r="15" fill="#246b56"/><text x="865.5" y="170" text-anchor="middle" font-size="16" fill="white">4</text><text x="857.5" y="211" font-size="20" font-weight="600">双击启动</text><text x="857.5" y="247" font-size="15" fill="#748179">启动聊天记录查看器.cmd</text><text x="857.5" y="274" font-size="15" fill="#748179">在独立窗口里开始阅读</text><text x="36" y="376" font-size="16" fill="#246b56">所需组件随源码附带，无需 npm install；聊天数据和本机配置由你自己保留。</text></g></svg>