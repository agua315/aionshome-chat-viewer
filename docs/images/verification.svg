<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-label="轻量验证，用虚构记录检查功能"><rect width="100%" height="100%" rx="24" fill="#f4f6ef"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#25332e"><text x="36" y="56" font-size="28" font-weight="600">轻量验证，用虚构记录检查功能</text><text x="36" y="92" font-size="16" fill="#748179">在程序目录运行 npm test；无需读取真实聊天记录</text><rect x="36" y="133" width="337.3333333333333" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="66" cy="164" r="15" fill="#246b56"/><text x="66" y="170" text-anchor="middle" font-size="16" fill="white">1</text><text x="58" y="211" font-size="20" font-weight="600">聊天与同步</text><text x="58" y="247" font-size="15" fill="#748179">浏览、搜索、编辑、存档</text><text x="58" y="274" font-size="15" fill="#748179">外部编辑同步与手机登录</text><path d="M 377.3333333333333 225 h 10 m -4 -5 l 5 5 -5 5" fill="none" stroke="#8da08e" stroke-width="2"/><rect x="391.3333333333333" y="133" width="337.3333333333333" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="421.3333333333333" cy="164" r="15" fill="#246b56"/><text x="421.3333333333333" y="170" text-anchor="middle" font-size="16" fill="white">2</text><text x="413.3333333333333" y="211" font-size="20" font-weight="600">阅读与外观</text><text x="413.3333333333333" y="247" font-size="15" fill="#748179">小剧场成稿、目录、选章</text><text x="413.3333333333333" y="274" font-size="15" fill="#748179">主题、CSS 预设与背景</text><path d="M 732.6666666666666 225 h 10 m -4 -5 l 5 5 -5 5" fill="none" stroke="#8da08e" stroke-width="2"/><rect x="746.6666666666666" y="133" width="337.3333333333333" height="188" rx="18" fill="#fffefa" stroke="#dce6da"/><circle cx="776.6666666666666" cy="164" r="15" fill="#246b56"/><text x="776.6666666666666" y="170" text-anchor="middle" font-size="16" fill="white">3</text><text x="768.6666666666666" y="211" font-size="20" font-weight="600">导出与分享</text><text x="768.6666666666666" y="247" font-size="15" fill="#748179">文档导出与单张长图</text><text x="768.6666666666666" y="274" font-size="15" fill="#748179">独白样式与马赛克遮挡</text><text x="36" y="376" font-size="16" fill="#246b56">验证用临时数据完成，检查通过后再提交源码与文档示意图。</text></g></svg>